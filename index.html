const IMG = {}, ANC = {};
let PXU = 0.56; // world units per sprite pixel
function computeAnchor(k) {
  const im = IMG[k];
  const c = document.createElement('canvas');
  c.width = im.width; c.height = im.height;
  const x = c.getContext('2d');
  x.drawImage(im, 0, 0);
  const d = x.getImageData(0, 0, c.width, c.height).data;
  let top = -1;
  for (let y = 0; y < c.height && top < 0; y++)
    for (let xx = 0; xx < c.width; xx++) if (d[(y * c.width + xx) * 4 + 3] > 0) { top = y; break; }
  if (top < 0) top = 0;
  let sx = 0, n = 0, x0 = 1e9, x1 = -1;
  for (let y = top; y < Math.min(c.height, top + 9); y++)
    for (let xx = 0; xx < c.width; xx++) if (d[(y * c.width + xx) * 4 + 3] > 0) { sx += xx; n++; if (xx < x0) x0 = xx; if (xx > x1) x1 = xx; }
  ANC[k] = { ax: n ? sx / n : c.width / 2, ay: top + 5, ext: Math.max(4, x1 - x0) };
}
function loadSprites(cb) {
  const keys = Object.keys(SPR);
  let n = 0;
  keys.forEach(k => {
    const im = new Image();
    im.onload = () => {
      IMG[k] = im; computeAnchor(k);
      if (++n === keys.length) { PXU = HERO_H / IMG.hangBack.height; cb(); }

    im.src = 'data:image/png;base64,' + SPR[k];

}
// draw with the raised-hands anchor at world (x,y)
function drawAnch(k, x, y, flip, dy) {
  const im = IMG[k], a = ANC[k], s = PXU * u;

  ctx.save();
  ctx.translate(sx, sy);
  if (flip) ctx.scale(-1, 1);
  ctx.drawImage(im, Math.round(-a.ax * s), Math.round(-a.ay * s), Math.round(im.width * s), Math.round(im.height * s));
  ctx.restore();
}
// draw with bottom-centre at world (x,y)
function drawBase(k, x, y, flip) {
  const im = IMG[k], s = PXU * u;
  const sx = Math.round(x * u), sy = Math.round(wy(y));
  ctx.save();
  ctx.translate(sx, sy);
  if (flip) ctx.scale(-1, 1);
  ctx.drawImage(im, Math.round(-im.width * s / 2), Math.round(-im.height * s), Math.round(im.width * s), Math.round(im.height * s));
  ctx.restore();
}

  reach() { noise(0.12, 0.03, 0, 1500); },
  dyno() { tone(220, 0.3, 'square', 0.07, 900); noise(0.25, 0.04, 0, 800); },
  chalk() { noise(0.35, 0.07, 0, 2500); tone(1200, 0.08, 'triangle', 0.04, 1800, 0.05); },
  pick() { [660, 880, 1320].forEach((f, i) => tone(f, 0.09, 'square', 0.06, null, i * 0.07)); },

  thud() { tone(90, 0.25, 'sine', 0.2, 40); noise(0.18, 0.1); },

function musicTick() {
  if (!AC || muted || !musicOn) { nextT = 0; return; }
  const spb = 60 / 132 / 4;
  if (!nextT || nextT < AC.currentTime) nextT = AC.currentTime + 0.05;
  while (nextT < AC.currentTime + 0.25) {
    const t = nextT - AC.currentTime;
    const st = step % 16;
    if (st % 4 === 0) tone(140, 0.12, 'sine', 0.13, 45, t);
    if (st % 4 === 2) noise(0.04, 0.025, t, 6000);

    if (st === 6 || st === 14) tone(bass * 4, 0.08, 'triangle', 0.025, null, t);

function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

function buildRoute(R) {

  holds.push({ x, y, type: 'start', id: 0, pick: null });
  for (let i = 1; i <= R.n; i++) {
    const dy = R.step[0] + rng() * (R.step[1] - R.step[0]);
    let nx = Math.max(32, Math.min(W0 - 32, x + (rng() * 2 - 1) * 78));
    while (Math.hypot(nx - x, dy) > REACH - 12) nx = x + (nx - x) * 0.9;
    let type = (i === R.n) ? 'top' : (i % 8 === 0 ? 'rest' : pickWeighted(rng, R.types));
    if (type === 'crumbly' && holds[holds.length - 1].type === 'crumbly') type = 'norm';
    let pick = null;
    if (type !== 'top' && type !== 'rest' && i > 1 && i % 5 === 2) pick = rng() < 0.62 ? 'chalk' : 'hot';
    x = nx; y += dy;
    holds.push({ x, y, type, id: i, pick });
  }
  // a few extra live jugs to the side so there's some choice
  const extras = [];
  for (let i = 1; i < holds.length - 1; i++) {
    if (rng() < 0.4) {
      const side = rng() < 0.5 ? -1 : 1;
      let ex = holds[i].x + side * (46 + rng() * 22), ey = holds[i].y + 6 + rng() * 22;
      if (ex < 26 || ex > W0 - 26) ex = holds[i].x - side * 52;
      extras.push({ x: ex, y: ey, type: rng() < 0.2 ? 'greasy' : 'norm', id: 100 + i, pick: null });
    }
  }
  G.holds = holds.concat(extras);
  G.topY = holds[holds.length - 1].y;

  const cols = ['#ef4444', '#3b82f6', '#f59e0b', '#e5e7eb', '#a855f7', '#14b8a6'];
  const dec = [];
  for (let k = 0; k < 90; k++) {
    const dx = 14 + rng() * (W0 - 28), dyy = 40 + rng() * (G.topY + 140);
    if (G.holds.some(h => Math.hypot(h.x - dx, h.y - dyy) < 24)) continue;

  const d = Math.hypot(h.x - P.hold.x, h.y - P.hold.y);
  if (d <= REACH) return startMove(h, false);

function bestUp(dir) {

  const me = P.hold; let best = null, bs = 1e9;

function spawnHazard(R) {
  const type = R.hazTypes[Math.floor(Math.random() * R.hazTypes.length)];
  const x = Math.max(24, Math.min(W0 - 24, P.x + (Math.random() * 2 - 1) * 70));
  G.haz.push({ type, x, y: 0, warn: 0.9, vy: 0, rot: 0, fall: false });
  SFX.warn();
}

function updateClimb(dt) {
  G.time += dt;
  const R = ROUTES[G.routeIdx];
  if (P.inv > 0) P.inv -= dt;
  if (P.chalkT > 0) P.chalkT -= dt;

  if (P.mode === 'hang') {
    const h = P.hold;
    if (P.chalkT <= 0) {
      if (h.type === 'rest') P.grip = Math.min(100, P.grip + 8 * dt);
      else P.grip -= (DRAIN[h.type] || 6) * dt;
    }
    P.hangT += dt;
    if (!P.warned && P.grip < 22 && P.grip > 0) { P.warned = true; say('HANG ON, HANG ON, HANG ON!', '#fca5a5', 1.4, 0.8, 'hangon'); SFX.warn(); }
    if (P.grip <= 0) { P.grip = 0; startFall('grip'); }
    else if (h.type === 'crumbly' && P.hangT > 1.5) { h.broken = true; burst(h.x, h.y, 16, ['#a16207', '#84cc16', '#713f12'], 70, 0.8, 120); startFall('crumble'); }
    else if (h.type === 'top') {
      P.topT += dt;
      if (P.topT >= 1.0) winRoute();
    }
  } else if (P.mode === 'reach' || P.mode === 'dyno') {
    P.t += dt;
    let e = Math.min(1, P.t / P.dur);
    const ee = e * e * (3 - 2 * e);
    if (P.doomed && e > 0.7) { startFall('dyno'); }
    else {
      P.x = P.from.x + (P.to.x - P.from.x) * ee;
      P.y = P.from.y + (P.to.y - P.from.y) * ee + (P.mode === 'dyno' ? Math.sin(Math.PI * e) * 26 : Math.sin(Math.PI * e) * 5);
      if (e >= 1) land(P.to);
    }
  } else if (P.mode === 'fall') {
    P.vy += 1300 * dt;
    P.fy -= P.vy * dt;
    if (P.fy <= MAT_TOP) {
      P.fy = MAT_TOP; G.shake = Math.min(0.5, P.vy / 900);
      SFX.thud(); burst(P.fx, MAT_TOP, 14, ['#60a5fa', '#93c5fd', '#fff'], 50, 0.5, -40);
      if (P.bounced < 1 && P.vy > 160) { P.vy = -P.vy * 0.3; P.bounced++; }
      else { P.mode = 'lie'; P.lieT = 0; say('BWAYNO', '#fca5a5', 1.8, 1.2, 'bwayno'); }
    }
  } else if (P.mode === 'lie') {
    P.lieT += dt;
    if (P.lieT > 1.1) G.retry = true;
  }

  // hazards
  if (R.haz > 0 && (P.mode === 'hang' || P.mode === 'reach' || P.mode === 'dyno')) {
    G.hazT -= dt;
    if (G.hazT <= 0 && P.y > 130) { spawnHazard(R); G.hazT = R.haz * (0.7 + Math.random() * 0.6); }
  }
  for (const z of G.haz) {
    if (z.warn > 0) { z.warn -= dt; z.y = G.camY + VH - 6; if (z.warn <= 0) { z.fall = true; z.y = G.camY + VH + 8; z.vy = 90; } }
    else {
      z.vy = Math.min(300, z.vy + 380 * dt); z.y -= z.vy * dt; z.rot += dt * 4;
      if (z.y < MAT_TOP) { z.dead = true; burst(z.x, MAT_TOP, 8, ['#e2e8f0', '#94a3b8'], 40, 0.4, -40); }
      if (P.inv <= 0 && (P.mode === 'hang' || P.mode === 'reach' || P.mode === 'dyno')) {
        if (Math.abs(z.x - P.x) < 17 && z.y < P.y + 6 && z.y > P.y - HERO_H) {
          z.dead = true; P.inv = 1.2; G.shake = 0.35; SFX.hit();
          const dmg = z.type === 'onion' ? 42 : 24;
          P.grip = Math.max(0, P.grip - dmg);
          burst(P.x, P.y - 20, 14, z.type === 'onion' ? ['#c084fc', '#f3e8ff', '#fff'] : ['#fde047', '#fff'], 70, 0.6, -20);
          if (z.type === 'onion') { say('AHHHH! ONIONS!', '#e9d5ff', 1.5, 0.9, 'onion'); G.tear = 2.5; daveSays('NOT THE ONIONS!', 1.8); }
          else say('WOW, WOW, WOW.', '#fca5a5', 1, 0.9);
          if (P.grip <= 0 && P.mode === 'hang') startFall('hit');

  if (G.tear > 0) G.tear -= dt;

  const targetBottom = (P.mode === 'fall' || P.mode === 'lie') ? Math.min(G.camY, Math.max(-6, P.fy - VH * 0.3)) : P.y - VH * 0.34;
  const maxBottom = G.topY + 70 - VH;
  let tb = Math.max(-6, Math.min(Math.max(maxBottom, -6), targetBottom));

}

function update(dt) {
  G.t += dt;
  pollPad();
  if (G.cap) { G.cap.t += dt; if (G.cap.t > G.cap.dur) G.cap = null; }
  if (G.daveT > 0) { G.daveT -= dt; if (G.daveT <= 0) G.daveSay = null; }
  if (G.shake > 0) G.shake -= dt;
  for (const p of G.parts) { p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += p.g * dt; }
  G.parts = G.parts.filter(p => p.life > 0);

  switch (G.state) {
    case 'intro':
      G.introT += dt;
      { const tb = P.y - VH * 0.34; G.camY += (Math.max(-6, tb) - G.camY) * Math.min(1, dt * 5); }
      if (G.introT > 1.6 && !G.cap) { G.state = 'climb'; say('ENGAGE!', '#a5f3fc', 0.9, 1.3, 'engage'); SFX.pick(); }

    ctx.fillRect(Math.round(bx + i * CW * 0.045), Math.round(cy), Math.round(CW * 0.034), Math.round(CW * 0.034));
  }
  if (P.hot) text('HOT AIR', bx + CW * 0.34, cy + CW * 0.03, CW * 0.032, '#fde68a', 'left');
  // score
  text(String(G.score).padStart(6, '0'), CW - m, m + CW * 0.045, CW * 0.055, '#fff', 'right');
  text('ROUTE ' + (G.routeIdx + 1) + '  ' + G.maxId + '/' + R.n, CW - m, m + CW * 0.09, CW * 0.032, '#a5f3fc', 'right');
  const t = G.time; text(Math.floor(t / 60) + ':' + String(Math.floor(t % 60)).padStart(2, '0'), CW - m, m + CW * 0.13, CW * 0.032, '#c4b5fd', 'right');

  // buttons (bottom)
  if (G.state === 'climb' || G.state === 'intro') {
    const b = BTN.chalk(), usable = P.chalk > 0 && P.mode === 'hang';
    ctx.globalAlpha = usable ? 0.95 : 0.4;
    ctx.fillStyle = '#f8fafc'; ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.fillStyle = '#94a3b8'; ctx.fillRect(b.x, b.y + b.h - CW * 0.015, b.w, CW * 0.015);
    ctx.globalAlpha = 1;
    text('CHALK UP', b.x + b.w / 2, b.y + b.h * 0.62, CW * 0.048, usable ? '#14102a' : '#64748b', 'center', usable ? '#fff' : '#cbd5e1');
    const mb = BTN.mute();
    ctx.fillStyle = 'rgba(20,16,42,0.7)'; ctx.fillRect(mb.x, mb.y, mb.w, mb.h);
    text(muted ? 'OFF' : 'SND', mb.x + mb.w / 2, mb.y + mb.h * 0.62, CW * 0.03, '#fff');
  }
}

function drawCaption() {
  const c = G.cap; if (!c) return;
  const pop = Math.min(1, c.t / 0.12), out = c.t > c.dur - 0.25 ? Math.max(0, (c.dur - c.t) / 0.25) : 1;
  ctx.globalAlpha = out;
  const size = CW * 0.052 * c.size * (0.6 + 0.4 * pop + (c.t < 0.12 ? 0.25 * (1 - pop) : 0));
  const lines = wrap(c.text, CW * 0.92, size);
  const y0 = CH * 0.27;
  lines.forEach((l, i) => text(l, CW / 2, y0 + i * size * 1.05, size, c.color));
  ctx.globalAlpha = 1;
}

function drawTear() {
  if (G.tear <= 0) return;
  ctx.fillStyle = 'rgba(168,85,247,' + Math.min(0.25, G.tear * 0.12) + ')';
  ctx.fillRect(0, 0, CW, CH);
}

function drawTitle() {
  ctx.fillStyle = '#1b1830'; ctx.fillRect(0, 0, CW, CH);
  // scrolling wall bg
  ctx.fillStyle = '#2b2748';
  for (let i = 0; i < 12; i++) ctx.fillRect(0, Math.round(((i * 90 + G.t * 30) % (CH + 90)) - 90), CW, 3);
  const n = 1 + (Math.floor(G.t * (2 + G.t * 0.35)) % 6);
  const hi = Array(n).fill('HI').join(' ');
  const cols = ['#a3e635', '#facc15', '#22d3ee', '#f472b6'];
  text(hi, CW / 2, CH * 0.11, CW * 0.095, cols[Math.floor(G.t * 4) % 4]);
  text(GAME_TITLE, CW / 2, CH * 0.185, CW * 0.078, '#fff');
  text("HOOK 'EM HORNS!", CW / 2, CH * 0.235, CW * 0.048, '#f97316');
  const im = IMG.happy, sc = (CH * 0.40) / im.height;
  ctx.drawImage(im, Math.round(CW / 2 - im.width * sc / 2), Math.round(CH * 0.31 + Math.sin(G.t * 3) * 4), Math.round(im.width * sc), Math.round(im.height * sc));
  if (Math.floor(G.t * 2) % 2 === 0) text('TAP TO MAKE IT SO', CW / 2, CH * 0.82, CW * 0.052, '#d9f99d');
  text('TAP A GLOWING HOLD TO REACH', CW / 2, CH * 0.87, CW * 0.034, '#c4b5fd');
  text('TAP CHALK UP WHEN YOUR GRIP RUNS LOW', CW / 2, CH * 0.905, CW * 0.03, '#c4b5fd');
  if (!('ontouchstart' in window)) text('KEYS: ARROWS + SPACE, C = CHALK', CW / 2, CH * 0.935, CW * 0.026, '#8b87b0');
  if (G.best.length) text('BEST ' + G.best[0].n + '  ' + String(G.best[0].s).padStart(6, '0'), CW / 2, CH * 0.955, CW * 0.036, '#fde68a');
}

function drawAd() {
  const A = ADS[G.adIdx % ADS.length];
  ctx.fillStyle = '#14102a'; ctx.fillRect(0, 0, CW, CH);
  // scanlines
  ctx.fillStyle = 'rgba(255,255,255,0.04)';
  for (let y = 0; y < CH; y += 6) ctx.fillRect(0, y, CW, 2);
  text('\u2605 A MESSAGE FROM OUR SPONSOR \u2605', CW / 2, CH * 0.09, CW * 0.036, '#8b87b0');
  ctx.fillStyle = '#facc15'; ctx.fillRect(CW * 0.06, CH * 0.12, CW * 0.88, CH * 0.12);
  ctx.fillStyle = '#14102a';
  const bl = wrap(A.brand, CW * 0.8, CW * 0.062);
  bl.forEach((l, i) => { ctx.font = font(CW * 0.062); ctx.textAlign = 'center'; ctx.fillText(l, CW / 2, CH * 0.185 + (i - (bl.length - 1) / 2) * CW * 0.07); });
  const chars = Math.min(A.text.length, Math.floor(G.adT * 55));
  const lines = wrap(A.text.slice(0, chars), CW * 0.84, CW * 0.052);
  lines.forEach((l, i) => text(l, CW * 0.08, CH * 0.33 + i * CW * 0.075, CW * 0.052, '#fff', 'left'));
  if (chars >= A.text.length) {
    if (Math.floor(G.t * 2) % 2 === 0) text('TAP TO CONTINUE', CW / 2, CH * 0.92, CW * 0.046, '#d9f99d');
    else text('', 0, 0, 1);
    const sz = CW * 0.022;
    text('SIDE EFFECTS MAY INCLUDE BWAYNO. NOT AVAILABLE IN SACK TOWN.', CW / 2, CH * 0.97, sz, '#6d6894');
  }
}

function drawWin() {
  const R = ROUTES[G.routeIdx];
  ctx.fillStyle = 'rgba(20,16,42,0.55)'; ctx.fillRect(0, CH * 0.5, CW, CH * 0.5);
  text('ROUTE SENT!', CW / 2, CH * 0.62, CW * 0.09, '#d9f99d');
  text('+' + G.lastBonus + ' BONUS', CW / 2, CH * 0.69, CW * 0.05, '#fde68a');
  if (G.routeFalls === 0) text('FLASH! NO FALLS!', CW / 2, CH * 0.74, CW * 0.05, '#a5f3fc');
  text('SCORE ' + String(G.score).padStart(6, '0'), CW / 2, CH * 0.82, CW * 0.05, '#fff');
  if (G.winT > 2.2 && Math.floor(G.t * 2) % 2 === 0) text('TAP TO CONTINUE', CW / 2, CH * 0.92, CW * 0.044, '#d9f99d');
}

function drawEnd() {
  ctx.fillStyle = '#1b1830'; ctx.fillRect(0, 0, CW, CH);
  const im = IMG.victory, sc = (CH * 0.34) / im.height;
  ctx.drawImage(im, Math.round(CW / 2 - im.width * sc / 2), Math.round(CH * 0.1 + Math.abs(Math.sin(G.t * 5)) * -6), Math.round(im.width * sc), Math.round(im.height * sc));
  text('YOU SENT IT!', CW / 2, CH * 0.5, CW * 0.085, '#d9f99d');
  let y = CH * 0.57;
  ENDING_MESSAGE.forEach(l => { wrap(l, CW * 0.88, CW * 0.044).forEach(ln => { text(ln, CW / 2, y, CW * 0.044, '#fff'); y += CW * 0.06; }); y += CW * 0.02; });
  text('FINAL SCORE ' + String(G.score).padStart(6, '0'), CW / 2, CH * 0.9, CW * 0.05, '#fde68a');
  text('FALLS: ' + G.totalFalls, CW / 2, CH * 0.94, CW * 0.035, '#a5f3fc');
  if (G.endT > 1.2 && Math.floor(G.t * 2) % 2 === 0) text('TAP FOR TITLE', CW / 2, CH * 0.98, CW * 0.032, '#d9f99d');
}

function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  if (G.state === 'loading') { ctx.fillStyle = '#1b1830'; ctx.fillRect(0, 0, CW, CH); text('LOADING...', CW / 2, CH / 2, CW * 0.06, '#d9f99d'); return; }
  if (G.state === 'title') { drawTitle(); return; }
  if (G.state === 'ad') { drawAd(); return; }
  if (G.state === 'end') { drawEnd(); return; }
  ctx.save();
  if (G.shake > 0) ctx.translate((Math.random() - 0.5) * G.shake * u * 6, (Math.random() - 0.5) * G.shake * u * 6);
  drawWall();
  drawMatFloor();
  drawDave(225, MAT_TOP + 3, G.daveSay);
  drawHolds();
  drawHazards();
  drawPlayer();
  drawParts();
  ctx.restore();
  drawTear();
  drawHUD();
  if (G.state === 'intro') {
    const R = ROUTES[G.routeIdx];
    text(R.name, CW / 2, CH * 0.3, CW * 0.075, '#fff');
    text(R.sub, CW / 2, CH * 0.3 + CW * 0.07, CW * 0.04, '#c4b5fd');
    if (G.routeIdx === 0) text('TAP A GLOWING HOLD', CW / 2, CH * 0.45, CW * 0.045, '#d9f99d');
  }
  drawCaption();
  if (G.state === 'win') drawWin();
  if (G.state === 'climb' && P.mode === 'lie' && G.retry) text('TAP TO TRY AGAIN', CW / 2, CH * 0.5, CW * 0.06, '#fff');
}

function advanceAd() {
  const A = ADS[G.adIdx % ADS.length];
  if (G.adT * 55 < A.text.length) { G.adT = 99; return; }
  if (G.routeIdx + 1 < ROUTES.length) startRoute(G.routeIdx + 1);
  else finishGame();
}
function finishGame() {
  G.state = 'end'; G.endT = 0; musicOn = false;
  let name = 'JAM';
  try { name = (prompt('NEW SCORE ' + G.score + '! ENTER 3 INITIALS', 'JAM') || 'JAM').toUpperCase().slice(0, 3); } catch (e) {}
  G.best.push({ n: name, s: G.score });
  G.best.sort((a, b) => b.s - a.s); G.best = G.best.slice(0, 5);
  try { localStorage.setItem(BEST_KEY, JSON.stringify(G.best)); } catch (e) {}
}

// ============================================================
//  Main loop
// ============================================================
let last = 0;
function frame(ts) {
  const dt = Math.min(0.05, (ts - last) / 1000 || 0); last = ts;
  update(dt); render();
  requestAnimationFrame(frame);
}
try { G.best = JSON.parse(localStorage.getItem(BEST_KEY) || '[]'); } catch (e) { G.best = []; }
window.__dbg.startRoute = startRoute; window.__dbg.onTap = onTap; window.__dbg.attempt = attempt; window.__dbg.winRoute = winRoute; window.__dbg.finishGame = finishGame;
window.__dbg.setState = s => { G.state = s; };
loadSprites(() => { G.state = 'title'; });
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
